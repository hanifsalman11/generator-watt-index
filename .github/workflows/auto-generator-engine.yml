name: Autonomous Backup Generator Wattage & Transfer Switch Engine

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_gen:
        description: 'Optional Generator Model or Scenario (e.g. Westinghouse WGen11500TFc)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-generator-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Generator Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_GEN: ${{ github.event.inputs.custom_gen || '' }}
        run: |
          python engine/generator_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_generators.json
          if git diff --staged --quiet; then
            echo "No new generator calculator pages to commit."
          else
            git commit -m "chore(power): auto-publish new generator wattage & transfer switch calculators"
            git push origin main
          fi
